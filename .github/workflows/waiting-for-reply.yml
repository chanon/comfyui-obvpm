name: Close issues waiting for a reply
on:
  # an open issue labelled "waiting for reply" closes once it has had no
  # activity for 5 days (labelling it starts the clock; any comment or
  # edit restarts it)
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # a comment from anyone but the repo owner is the reply: the label
  # comes off, so the issue never closes while the answer is owed to them
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  close:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = "waiting for reply";
            const DAYS = 5;
            const { owner, repo } = context.repo;
            // the label exists from the first run on
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.issues.createLabel({ owner, repo, name: LABEL,
                color: "fbca04", description: "Closes after 5 days without a reply" });
            }
            const issues = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: "open", labels: LABEL, per_page: 100 });
            const cutoff = Date.now() - DAYS * 24 * 60 * 60 * 1000;
            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (new Date(issue.updated_at).getTime() > cutoff) continue;
              await github.rest.issues.createComment({ owner, repo,
                issue_number: issue.number, body: "Closed due to no reply." });
              await github.rest.issues.update({ owner, repo,
                issue_number: issue.number, state: "closed", state_reason: "not_planned" });
              core.info(`closed #${issue.number}`);
            }

  replied:
    if: >-
      github.event_name == 'issue_comment'
      && !github.event.issue.pull_request
      && github.event.comment.user.login != github.repository_owner
      && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = "waiting for reply";
            const issue = context.payload.issue;
            if (!issue.labels.some((l) => l.name === LABEL)) return;
            await github.rest.issues.removeLabel({ ...context.repo,
              issue_number: issue.number, name: LABEL });
