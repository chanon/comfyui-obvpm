[project]
name = "comfyui-obvpm"
description = "Bundle multiple wires into one wire. Create customizable Presets nodes. Compose ref images in one node. ComfyUI nodes to save time and keep your workflows tidy."
version = "0.2.8"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"

# Deliberately empty: every third-party import in this pack (torch,
# torchaudio, numpy, safetensors, av) is already in ComfyUI's own
# requirements.txt. Listing them again would let this pack's pins
# contradict core's on someone else's install.
dependencies = []

[project.urls]
Repository = "https://github.com/chanon/comfyui-obvpm"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "chanon"
DisplayName = "comfyui-obvpm"
Icon = ""
